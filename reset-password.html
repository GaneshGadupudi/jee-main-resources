<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | JEE Preparation Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <section class="section">
    <div class="wrap" style="max-width:440px">
      <div class="card">
        <h1 style="font-size:2rem">Set a new password</h1>
        <p class="lead" style="font-size:1rem">Open this page from the link in your reset email.</p>
        <form id="authForm" data-mode="reset" novalidate>
          <label for="password">New password</label>
          <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
          <button class="btn block" id="go" type="submit" style="margin-top:20px">Save password</button>
          <p id="msg" class="msg" role="status"></p>
        </form>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/layout.js"></script>
<script src="assets/js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
