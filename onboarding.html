<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your exam | JEE Preparation Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-needs-login>
<main>
  <section class="section">
    <div class="wrap" style="max-width:520px">
      <div class="card">
        <p id="hi" style="color:var(--accent);font-weight:700;margin-bottom:4px"></p>
        <h1 style="font-size:2rem">Which exam are you preparing for?</h1>
        <p class="lead" style="font-size:1rem">Choose one or more. You can change this later.</p>
        <form id="examForm">
          <div style="display:grid;gap:12px">
            <label class="opt"><input type="checkbox" name="exam" value="JEE Main"><span><b>JEE Main</b><small>NITs, IIITs and the qualifier for JEE Advanced</small></span></label>
            <label class="opt"><input type="checkbox" name="exam" value="JEE Advanced"><span><b>JEE Advanced</b><small>Admission to the IITs</small></span></label>
            <label class="opt"><input type="checkbox" name="exam" value="EAMCET"><span><b>EAMCET</b><small>State engineering entrance (Telangana and Andhra Pradesh)</small></span></label>
          </div>
          <button class="btn block" id="examGo" type="submit" style="margin-top:20px" disabled>Continue</button>
          <p id="msg" class="msg" role="status"></p>
        </form>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/layout.js"></script>
<script src="assets/js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
